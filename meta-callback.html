<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CortexPop Meta OAuth</title></head>
<body style="font-family:Arial,sans-serif;max-width:680px;margin:60px auto;padding:20px">
<h2>CortexPop · Meta</h2>
<p>Completando autorización…</p>
<p id="fallback" style="display:none">Si no continúa automáticamente, <a id="local" href="#">abrí CortexPop local</a>.</p>
<script>
const target = 'http://localhost:8797/meta/callback' + window.location.search + window.location.hash;
document.getElementById('local').href = target;
setTimeout(() => { window.location.replace(target); }, 300);
setTimeout(() => { document.getElementById('fallback').style.display = 'block'; }, 1500);
</script>
</body>
</html>
